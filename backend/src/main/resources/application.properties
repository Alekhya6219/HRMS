server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:peoplepulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.jpa.open-in-view=false